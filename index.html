<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weatherscope <!--🌤️--></title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  <link rel="stylesheet" href="style.css"/>
  
  <!-- PWA Support -->
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#1e3a8a"/>
</head>
<body class="bg-gradient-to-br from-blue-950 to-indigo-950 text-white min-h-screen">

  <div class="max-w-4xl mx-auto p-4">
    
    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-4xl font-bold flex items-center gap-3">
        <!--🌤️--> Weatherscope
      </h1>
      <button id="theme-toggle" class="p-3 rounded-xl bg-white/10 hover:bg-white/20 transition">
        <i class="fas fa-moon text-xl"></i>
      </button>
    </div>

    <!-- Search -->
    <div class="mb-8">
      <div class="relative">
        <input 
          type="text" 
          id="city-input"
          placeholder="Search city... (e.g. Dhaka, London, New York)"
          class="w-full bg-white/10 border border-white/20 rounded-2xl px-6 py-4 text-lg focus:outline-none focus:border-blue-400 transition"
        />
        <button id="search-btn" class="absolute right-4 top-1/2 -translate-y-1/2 bg-blue-600 hover:bg-blue-500 px-8 py-2.5 rounded-xl font-medium">
          Search
        </button>
      </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="hidden text-center py-12">
      <i class="fas fa-spinner fa-spin text-4xl mb-4"></i>
      <p class="text-lg">Fetching weather data...</p>
    </div>

    <!-- Current Weather -->
    <div id="current-weather" class="hidden glass rounded-3xl p-8 mb-8">
      <!-- JS will fill this -->
    </div>

    <!-- 7 Day Forecast -->
    <div id="forecast" class="hidden">
      <h2 class="text-2xl font-semibold mb-6 flex items-center gap-2">
        <i class="fas fa-calendar-alt"></i> 7-Day Forecast
      </h2>
      <div id="forecast-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4">
        <!-- JS will fill cards -->
      </div>
    </div>

  </div>

  <!-- Footer -->
  <footer class="fixed bottom-0 left-0 right-0 bg-black/30 backdrop-blur-md text-center py-4 text-sm text-gray-400">
    Built with Open-Meteo API • Weatherscope
  </footer>



  <script src="script.js"></script>
</body>
  </html>
